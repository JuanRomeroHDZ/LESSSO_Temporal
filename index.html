<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LESSSO. | RED &amp; BLUE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
/* ============ TOKENS ============
   JADE  -> #00b377 / brillante #2ee6a8
   ROJO  -> #ff003c (enemigo / acento)
   FONDO -> verde casi negro
================================= */
:root {
    --jade: #00b377;
    --jade-bright: #2ee6a8;
    --red: #ff003c;
    --bg: #030a08;
    --panel: rgba(6, 20, 15, .85);
    --line: rgba(0, 179, 119, .25);
    --txt-dim: #4d7a6a;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }

body {
    background: var(--bg);
    color: #e8fff6;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    cursor: none;
}
@media (pointer: coarse) { body { cursor: auto; } }

/* ============ MALLA DE PUNTOS JADE ============ */
body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background-image: radial-gradient(rgba(46, 230, 168, .07) 1px, transparent 1px);
    background-size: 26px 26px;
    pointer-events: none;
}

/* ============ CURSOR ============ */
.cursor-ring, .cursor-dot {
    position: fixed; top: 0; left: 0; z-index: 100; pointer-events: none;
    border-radius: 50%; transform: translate(-50%, -50%);
}
.cursor-dot { width: 5px; height: 5px; background: var(--red); box-shadow: 0 0 8px var(--red); }
.cursor-ring {
    width: 32px; height: 32px;
    border: 1px solid rgba(46, 230, 168, .6);
    transition: width .18s, height .18s, border-color .18s, transform .18s;
}
.cursor-ring::before, .cursor-ring::after { content: ''; position: absolute; background: rgba(46,230,168,.6); }
.cursor-ring::before { left: 50%; top: -6px; width: 1px; height: 5px; transform: translateX(-50%); }
.cursor-ring::after { top: 50%; left: -6px; height: 1px; width: 5px; transform: translateY(-50%); }
.cursor-ring.hovering { width: 50px; height: 50px; border-color: var(--red); }
@media (pointer: coarse) { .cursor-ring, .cursor-dot { display: none; } }

/* ============ BOOT ============ */
#boot {
    position: fixed; inset: 0; z-index: 90;
    background: var(--bg);
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 22px;
    transition: opacity .8s ease, visibility .8s;
}
#boot.done { opacity: 0; visibility: hidden; }
#bootLog {
    width: min(540px, 86vw);
    font-size: clamp(.68rem, 2.4vw, .82rem);
    line-height: 1.9;
    color: var(--jade-bright);
    min-height: 140px;
    text-shadow: 0 0 8px rgba(46,230,168,.3);
}
#bootLog .ok { color: #4ade80; }
#bootLog .warn { color: #fbbf24; }
#bootBarWrap { width: min(540px, 86vw); }
#bootLabel {
    display: flex; justify-content: space-between;
    font-size: .6rem; letter-spacing: 2px; color: var(--txt-dim);
    margin-bottom: 8px; text-transform: uppercase;
}
#bootBar { height: 4px; background: rgba(255,255,255,.07); border-radius: 99px; overflow: hidden; }
#bootFill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--jade), var(--red));
    box-shadow: 0 0 12px rgba(0,179,119,.6);
    transition: width .12s linear;
}

/* ============ CAPAS VISUALES ============ */
#war { position: absolute; inset: 0; z-index: 1; }
.vignette {
    position: absolute; inset: 0; z-index: 3; pointer-events: none;
    background: radial-gradient(circle at 50% 45%, transparent 26%, rgba(3,10,8,.94) 100%);
}
.scanlines {
    position: absolute; inset: 0; z-index: 4; pointer-events: none;
    background: repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0,0,0,.16) 3px);
}

/* ============ HUD ============ */
.hud-corner { position: absolute; width: 34px; height: 34px; z-index: 5; pointer-events: none; border: 2px solid rgba(46,230,168,.5); }
.hud-tl { top: 18px; left: 18px; border-right: none; border-bottom: none; }
.hud-tr { top: 18px; right: 18px; border-left: none; border-bottom: none; }
.hud-bl { bottom: 18px; left: 18px; border-right: none; border-top: none; }
.hud-br { bottom: 18px; right: 18px; border-left: none; border-top: none; }

.statusbar {
    position: absolute; top: 26px; left: 64px; right: 64px; z-index: 5;
    display: flex; justify-content: space-between; pointer-events: none;
    font-size: .65rem; letter-spacing: 2px; color: rgba(46,230,168,.75);
    text-transform: uppercase;
}
.statusbar .blink { animation: blink 1.1s steps(2) infinite; color: var(--red); }
@keyframes blink { 50% { opacity: 0; } }

/* ============ STAGE / TILT ============ */
.stage {
    position: relative; z-index: 10;
    width: 100%; height: 100%;
    display: flex; justify-content: center; align-items: center;
    perspective: 1200px;
}
.container {
    text-align: center; padding: 6vw; width: 100%; max-width: 900px;
    transform-style: preserve-3d; will-change: transform;
}

/* ============ TÍTULO ============ */
.main-title {
    font-family: 'Poppins', sans-serif;
    font-size: clamp(3rem, 14vw, 8.5rem);
    font-weight: 900;
    letter-spacing: -2px;
    line-height: 1;
    position: relative;
    display: inline-block;
    color: #f2fff9;
    text-shadow: 0 4px 30px rgba(0,179,119,.18);
    transform: translateZ(60px);
}
.red-dot {
    color: var(--red);
    display: inline-block;
    animation: pulse 2s infinite ease-in-out;
}
@keyframes pulse {
    0%, 100% { transform: scale(1); text-shadow: 0 0 12px var(--red); }
    50% { transform: scale(1.15); text-shadow: 0 0 35px var(--red); }
}
.glitch::before, .glitch::after {
    content: attr(data-text);
    position: absolute; inset: 0;
    overflow: hidden;
    clip-path: inset(0 0 100% 0);
    pointer-events: none;
}
.glitch::before { color: var(--jade-bright); animation: glitchA 3.4s infinite steps(1); left: 3px; }
.glitch::after { color: var(--red); animation: glitchB 2.9s infinite steps(1); left: -3px; }
@keyframes glitchA {
    0%, 92% { clip-path: inset(0 0 100% 0); transform: none; }
    93% { clip-path: inset(10% 0 55% 0); transform: translate(-4px,-2px); }
    95% { clip-path: inset(60% 0 5% 0); transform: translate(4px,2px); }
    97% { clip-path: inset(30% 0 40% 0); transform: translate(-2px,0); }
    100% { clip-path: inset(0 0 100% 0); transform: none; }
}
@keyframes glitchB {
    0%, 88% { clip-path: inset(0 0 100% 0); transform: none; }
    89% { clip-path: inset(45% 0 20% 0); transform: translate(4px,2px); }
    92% { clip-path: inset(5% 0 80% 0); transform: translate(-4px,-1px); }
    95% { clip-path: inset(70% 0 2% 0); transform: translate(2px,1px); }
    100% { clip-path: inset(0 0 100% 0); transform: none; }
}

/* ============ SUBTÍTULO ROTATIVO ============ */
.subtle-text {
    color: var(--txt-dim);
    font-size: clamp(.7rem, 2.6vw, 1rem);
    letter-spacing: clamp(4px, 1.4vw, 9px);
    text-transform: uppercase;
    margin-top: 14px;
}
.typer { color: var(--jade-bright); text-shadow: 0 0 10px rgba(46,230,168,.4); }
.cursor { color: var(--jade-bright); animation: blink 1s steps(2) infinite; }

/* ============ TERMINAL ============ */
.terminal {
    margin: 44px auto 0;
    max-width: 560px;
    text-align: left;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    backdrop-filter: blur(6px);
    box-shadow: 0 0 40px rgba(0,179,119,.08), 0 20px 60px rgba(0,0,0,.6);
    transform: translateZ(35px);
    transition: box-shadow .3s, border-color .3s;
}
.terminal:hover { border-color: rgba(46,230,168,.55); box-shadow: 0 0 60px rgba(0,179,119,.18), 0 20px 60px rgba(0,0,0,.6); }
.term-header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    background: rgba(255,255,255,.04);
    border-bottom: 1px solid rgba(255,255,255,.07);
}
.term-header .dot { width: 11px; height: 11px; border-radius: 50%; }
.dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
.term-title { margin: 0 auto; font-size: .65rem; color: #3d6355; letter-spacing: 1px; }
.term-body {
    padding: 16px 18px;
    font-size: clamp(.72rem, 2.6vw, .85rem);
    line-height: 1.8;
    min-height: 118px;
    color: var(--jade-bright);
    text-shadow: 0 0 8px rgba(46,230,168,.3);
}
.term-body .ok { color: #4ade80; }
.term-body .warn { color: #fbbf24; }
.term-body .bad { color: var(--red); }

/* ============ CONTADOR DE AMENAZAS ============ */
.threats {
    margin: 22px auto 0;
    max-width: 560px;
    display: flex; justify-content: center; gap: 26px;
    font-size: .62rem; letter-spacing: 2px; text-transform: uppercase;
    color: var(--txt-dim);
    transform: translateZ(20px);
}
.threats b { color: var(--jade-bright); font-weight: 700; }
.threats b.red { color: var(--red); }

/* ============ FOOTER ============ */
.specialty {
    margin-top: 32px;
    display: inline-block;
    color: var(--jade-bright);
    font-size: clamp(.75rem, 3vw, 1rem);
    letter-spacing: clamp(2px, 1vw, 4px);
    text-transform: uppercase;
    border-top: 1px dashed rgba(46,230,168,.35);
    padding-top: 18px;
    text-shadow: 0 0 12px rgba(46,230,168,.25);
    transform: translateZ(25px);
}

/* ============ REVEAL ============ */
.reveal { opacity: 0; transform: translateY(24px); transition: opacity .8s ease, transform .8s ease; }
body.ready .reveal { opacity: 1; transform: translateY(0); }
body.ready .d1 { transition-delay: .1s; } body.ready .d2 { transition-delay: .25s; }
body.ready .d3 { transition-delay: .4s; } body.ready .d4 { transition-delay: .55s; }
body.ready .d5 { transition-delay: .7s; }

@media (max-width: 480px) {
    .statusbar { left: 58px; right: 58px; font-size: .55rem; }
    .terminal { margin-top: 34px; }
    .threats { gap: 16px; }
}
</style>

<body>

<!-- BOOT -->
<div id="boot">
    <div id="bootLog"></div>
    <div id="bootBarWrap">
        <div id="bootLabel"><span>Estableciendo perímetro LESSSO</span><span id="bootPct">0%</span></div>
        <div id="bootBar"><div id="bootFill"></div></div>
    </div>
</div>

<!-- CURSOR -->
<div class="cursor-ring" id="cRing"></div>
<div class="cursor-dot" id="cDot"></div>

<!-- GUERRA DE RED -->
<canvas id="war"></canvas>
<div class="vignette"></div>
<div class="scanlines"></div>

<!-- HUD -->
<div class="hud-corner hud-tl"></div>
<div class="hud-corner hud-tr"></div>
<div class="hud-corner hud-bl"></div>
<div class="hud-corner hud-br"></div>

<div class="statusbar">
    <span>NET://LESSSO_PERIMETER</span>
    <span><span class="blink">●</span> DEFENSA ACTIVA</span>
    <span id="clock">00:00:00</span>
</div>

<div class="stage">
    <div class="container" id="tilt">
        <h1 class="main-title glitch reveal d1" data-text="LESSSO">
            LESSSO<span class="red-dot">.</span>
        </h1>
        <p class="subtle-text reveal d2">PRÓXIMAMENTE &nbsp;<span class="typer" id="typer"></span><span class="cursor">_</span></p>

        <div class="terminal reveal d3">
            <div class="term-header">
                <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
                <span class="term-title">sentinel@lessso: ~/perimeter</span>
            </div>
            <div class="term-body" id="termBody"></div>
        </div>

        <div class="threats reveal d4">
            <span>INTRUSOS &nbsp;<b class="red" id="blockedCount">0</b></span>
            <span>ARCHIVOS ROBADOS &nbsp;<b id="stolenCount">0</b></span>
            <span>INTERCEPTADOS &nbsp;<b id="interceptCount">0</b></span>
        </div>

        <p class="specialty reveal d5">PENTESTING &middot; RED TEAM</p>
    </div>
</div>

<script>
/* ============================================================
   SIMULACIÓN: GUERRA DE RED
   Nodos (servidores) unidos por enlaces. Paquetes ROJOS
   (atacantes) intentan infiltrarse y exfiltrar ARCHIVOS.
   Interceptores JADE los persiguen por el mismo enlace y
   chocan a mitad de camino. Los nodos comprometidos se
   desinfectan solos con un pulso de limpieza.
============================================================ */
const cv = document.getElementById('war');
const cx = cv.getContext('2d');
let W = 0, H = 0;
const nodes = [], edges = [], packets = [], sparks = [];
const FILES = ['/etc/shadow', 'id_rsa', '.env', 'passwd', 'db.sql', 'tokens.db', 'wallet.dat'];
let blocked = 0, stolen = 0, intercepted = 0;

function buildNet() {
    W = cv.width = innerWidth;
    H = cv.height = innerHeight;
    nodes.length = 0; edges.length = 0; packets.length = 0; sparks.length = 0;

    const target = Math.max(8, Math.min(15, Math.floor(W / 130)));
    let tries = 0;
    while (nodes.length < target && tries++ < 900) {
        const x = 60 + Math.random() * (W - 120);
        const y = 60 + Math.random() * (H - 120);
        if (nodes.every(p => Math.hypot(p.x - x, p.y - y) > 110)) {
            nodes.push({ x, y, comp: 0, pulse: Math.random() * Math.PI * 2 });
        }
    }
    for (let i = 0; i < nodes.length; i++)
        for (let j = i + 1; j < nodes.length; j++) {
            const d = Math.hypot(nodes[i].x - nodes[j].x, nodes[i].y - nodes[j].y);
            if (d < 300) edges.push({ a: nodes[i], b: nodes[j] });
        }
}
buildNet();
addEventListener('resize', buildNet);

function spawnIntruder() {
    if (!edges.length) return;
    const e = edges[Math.floor(Math.random() * edges.length)];
    const carryFile = Math.random() < .38;
    const p = {
        e, t: 0, dir: 1,
        speed: .006 + Math.random() * .005,
        side: 'red',
        file: carryFile ? FILES[Math.floor(Math.random() * FILES.length)] : null
    };
    packets.push(p);
    if (carryFile) {
        // caza: un interceptor jade entra por el otro extremo del mismo enlace
        setTimeout(() => {
            if (packets.includes(p)) packets.push({
                e, t: 1, dir: -1, speed: p.speed * (1.1 + Math.random() * .5),
                side: 'jade', hunter: true
            });
        }, 220);
    }
}

function spawnPatrol() {
    if (!edges.length) return;
    const e = edges[Math.floor(Math.random() * edges.length)];
    packets.push({
        e, t: Math.random(), dir: Math.random() < .5 ? 1 : -1,
        speed: .004 + Math.random() * .004, side: 'jade'
    });
}

function clash(p, q) {
    const x = p.e.a.x + (p.e.b.x - p.e.a.x) * p.t;
    const y = p.e.a.y + (p.e.b.y - p.e.a.y) * p.t;
    for (let i = 0; i < 14; i++) {
        const a = Math.random() * Math.PI * 2, s = .6 + Math.random() * 2.4;
        sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, red: Math.random() < .4 });
    }
    const jadeWins = Math.random() < .72;
    packets.splice(packets.indexOf(p), 1);
    packets.splice(packets.indexOf(q), 1);
    if (jadeWins) {
        intercepted++;
        packets.push({ e: p.e, t: p.t, dir: q.dir, speed: .005, side: 'jade' });
    } else {
        blocked++;
        packets.push({ e: p.e, t: p.t, dir: p.dir, speed: p.speed, side: 'red', file: p.file });
    }
}

function tick() {
    cx.clearRect(0, 0, W, H);

    /* --- enlaces --- */
    for (const e of edges) {
        cx.beginPath();
        cx.moveTo(e.a.x, e.a.y); cx.lineTo(e.b.x, e.b.y);
        cx.strokeStyle = 'rgba(0,179,119,.10)';
        cx.lineWidth = 1;
        cx.stroke();
    }

    /* --- nodos --- */
    for (const n of nodes) {
        n.pulse += .03;
        n.comp = Math.max(0, n.comp - .0018);
        const compromised = n.comp > .45;
        const glow = compromised ? '255,0,60' : '0,179,119';
        const breathe = 2 + Math.sin(n.pulse) * .8;
        // halo
        const g = cx.createRadialGradient(n.x, n.y, 0, n.x, n.y, 26);
        g.addColorStop(0, `rgba(${glow},${compromised ? .35 : .18})`);
        g.addColorStop(1, `rgba(${glow},0)`);
        cx.fillStyle = g;
        cx.fillRect(n.x - 26, n.y - 26, 52, 52);
        // núcleo
        cx.beginPath();
        cx.arc(n.x, n.y, 3.2 + breathe * .5, 0, Math.PI * 2);
        cx.fillStyle = compromised ? '#ff003c' : '#2ee6a8';
        cx.fill();
        // anillo si comprometido
        if (compromised) {
            cx.beginPath();
            cx.arc(n.x, n.y, 8 + Math.sin(n.pulse * 2) * 2, 0, Math.PI * 2);
            cx.strokeStyle = 'rgba(255,0,60,.5)';
            cx.lineWidth = 1;
            cx.stroke();
        }
    }

    /* --- paquetes --- */
    for (let i = packets.length - 1; i >= 0; i--) {
        const p = packets[i];
        p.t += p.speed * p.dir;
        if (p.t >= 1 || p.t <= 0) {
            const arrival = p.dir > 0 ? p.e.b : p.e.a;
            if (p.side === 'red') {
                arrival.comp = 1;                       // nodo comprometido
                if (p.file) stolen++;
            }
            packets.splice(i, 1);
            continue;
        }
        const x = p.e.a.x + (p.e.b.x - p.e.a.x) * p.t;
        const y = p.e.a.y + (p.e.b.y - p.e.a.y) * p.t;
        const red = p.side === 'red';
        // estela
        cx.beginPath();
        cx.moveTo(x - p.dir * 16 * (p.e.b.x - p.e.a.x) / 300, y - p.dir * 16 * (p.e.b.y - p.e.a.y) / 300);
        cx.lineTo(x, y);
        cx.strokeStyle = red ? 'rgba(255,0,60,.45)' : 'rgba(46,230,168,.45)';
        cx.lineWidth = 1.4;
        cx.stroke();
        // cuerpo
        cx.beginPath();
        cx.arc(x, y, red ? 3 : 2.4, 0, Math.PI * 2);
        cx.fillStyle = red ? '#ff003c' : '#2ee6a8';
        cx.shadowColor = red ? '#ff003c' : '#2ee6a8';
        cx.shadowBlur = 8;
        cx.fill();
        cx.shadowBlur = 0;
        // etiqueta de archivo exfiltrado
        if (p.file) {
            cx.font = '10px JetBrains Mono, monospace';
            cx.fillStyle = 'rgba(255,0,60,.85)';
            cx.fillText('⬇ ' + p.file, x + 8, y - 8);
        }
        if (p.hunter) {
            cx.font = '9px JetBrains Mono, monospace';
            cx.fillStyle = 'rgba(46,230,168,.7)';
            cx.fillText('⌖', x - 14, y - 8);
        }
    }

    /* --- duelos en el mismo enlace --- */
    for (let i = 0; i < packets.length; i++)
        for (let j = i + 1; j < packets.length; j++) {
            const a = packets[i], b = packets[j];
            if (a.e === b.e && a.side !== b.side && Math.abs(a.t - b.t) < .03) clash(a, b);
        }

    /* --- chispas --- */
    for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.x += s.vx; s.y += s.vy; s.life -= .03;
        if (s.life <= 0) { sparks.splice(i, 1); continue; }
        cx.globalAlpha = s.life;
        cx.fillStyle = s.red ? '#ff003c' : '#2ee6a8';
        cx.fillRect(s.x, s.y, 2, 2);
        cx.globalAlpha = 1;
    }

    requestAnimationFrame(tick);
}
tick();

setInterval(spawnIntruder, 1500);
setInterval(spawnPatrol, 900);

/* contadores en la UI */
const elB = document.getElementById('blockedCount');
const elS = document.getElementById('stolenCount');
const elI = document.getElementById('interceptCount');
setInterval(() => {
    elB.textContent = blocked;
    elS.textContent = stolen;
    elI.textContent = intercepted;
}, 600);

/* ============ CURSOR + TILT ============ */
const ring = document.getElementById('cRing');
const dot = document.getElementById('cDot');
const tilt = document.getElementById('tilt');
addEventListener('mousemove', e => {
    dot.style.left = e.clientX + 'px'; dot.style.top = e.clientY + 'px';
    ring.style.left = e.clientX + 'px'; ring.style.top = e.clientY + 'px';
    const rx = ((e.clientY / innerHeight) - .5) * -6;
    const ry = ((e.clientX / innerWidth) - .5) * 8;
    tilt.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
});
document.querySelectorAll('.terminal, .main-title, .specialty').forEach(el => {
    el.addEventListener('mouseenter', () => ring.classList.add('hovering'));
    el.addEventListener('mouseleave', () => ring.classList.remove('hovering'));
});

/* ============ BOOT ============ */
const bootLog = document.getElementById('bootLog');
const bootFill = document.getElementById('bootFill');
const bootPct = document.getElementById('bootPct');
const bootLines = [
    { text: 'LESSSO SENTINEL v2.1 — arranque del perímetro', cls: '' },
    { text: '[OK] Sensores de red .................. CALIBRADOS', cls: 'ok' },
    { text: '[OK] Firmas de intrusión .............. BASE ACTUALIZADA', cls: 'ok' },
    { text: '[!!] 3 paquetes hostiles .............. MARCADOS', cls: 'warn' },
    { text: '[OK] Cifrado de archivos .............. JADE-VAULT ACTIVO', cls: 'ok' },
    { text: 'Perímetro sellado. Operador autenticado.', cls: '' }
];
let pct = 0, li = 0;
const bootIv = setInterval(() => {
    pct = Math.min(100, pct + Math.random() * 9 + 2);
    bootFill.style.width = pct + '%';
    bootPct.textContent = Math.floor(pct) + '%';
    if (pct >= 100) {
        clearInterval(bootIv);
        setTimeout(() => {
            document.getElementById('boot').classList.add('done');
            document.body.classList.add('ready');
            setTimeout(startTerminal, 900);
        }, 450);
    }
}, 130);

function typeBootLine() {
    if (li >= bootLines.length) return;
    const div = document.createElement('div');
    if (bootLines[li].cls) div.className = bootLines[li].cls;
    bootLog.appendChild(div);
    let ci = 0;
    const iv = setInterval(() => {
        div.textContent = bootLines[li].text.slice(0, ++ci);
        if (ci >= bootLines[li].text.length) {
            clearInterval(iv); li++;
            setTimeout(typeBootLine, 160);
        }
    }, 14);
}
typeBootLine();

/* ============ TERMINAL ============ */
const termLines = [
    { text: '$ sentinel --watch --perimeter', cls: '' },
    { text: '[+] Enlaces monitoreados................ ' + 'OK', cls: 'ok' },
    { text: '[!] Exfiltración /etc/shadow........... BLOQUEADA', cls: 'bad' },
    { text: '[+] Interceptor despachado............ CAZANDO_', cls: '' }
];
const termBody = document.getElementById('termBody');
let ti = 0;
function startTerminal() { setTimeout(typeTerm, 200); }
function typeTerm() {
    if (ti >= termLines.length) return;
    const div = document.createElement('div');
    if (termLines[ti].cls) div.className = termLines[ti].cls;
    termBody.appendChild(div);
    let ci = 0;
    const iv = setInterval(() => {
        div.textContent = termLines[ti].text.slice(0, ++ci);
        if (ci >= termLines[ti].text.length) {
            clearInterval(iv); ti++;
            setTimeout(typeTerm, 380);
        }
    }, 26);
}

/* ============ SUBTÍTULO ROTATIVO ============ */
const words = ['PENTESTING', 'RED TEAM', 'OSINT', 'CIBERSEGURIDAD OFENSIVA'];
const typer = document.getElementById('typer');
let wi = 0;
function typeWord() {
    const word = words[wi];
    let i = 0;
    const iv = setInterval(() => {
        typer.textContent = word.slice(0, ++i);
        if (i >= word.length) { clearInterval(iv); setTimeout(eraseWord, 1700); }
    }, 65);
}
function eraseWord() {
    const iv = setInterval(() => {
        typer.textContent = typer.textContent.slice(0, -1);
        if (!typer.textContent.length) {
            clearInterval(iv);
            wi = (wi + 1) % words.length;
            setTimeout(typeWord, 250);
        }
    }, 32);
}
setTimeout(typeWord, 1400);

/* ============ RELOJ ============ */
const clock = document.getElementById('clock');
setInterval(() => {
    clock.textContent = new Date().toLocaleTimeString('es-419', { hour12: false });
}, 1000);
